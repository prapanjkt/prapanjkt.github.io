<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definitions | Prapanj</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .definition-folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin: 28px 0;
        }
        .definition-folder-card {
            display: block;
            padding: 22px;
            border: 1px solid var(--border-color, #ddd);
            border-radius: 12px;
            color: inherit;
            text-decoration: none;
            transition: transform .18s ease, border-color .18s ease;
        }
        .definition-folder-card:hover {
            transform: translateY(-3px);
            border-color: currentColor;
        }
        .definition-folder-card .folder-icon {
            font-size: 32px;
        }
        .definition-folder-card h2 {
            margin: 12px 0 8px;
        }
        .definition-folder-card p {
            margin: 0;
            opacity: .8;
            line-height: 1.6;
        }
        #folder-status { margin: 20px 0; }
    </style>
</head>
<body>
    <main class="dashboard-page">
        <p class="intro">Prapanj</p>
        <h1>Definitions</h1>
        <p>Explore definitions and learning notes.</p>

        <div id="folder-status" role="status">Loading folders...</div>
        <section id="definition-folders" class="definition-folder-grid" aria-label="Definition folders"></section>

        <p><a href="index.html">← Back to Home</a></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        "use strict";

        const SUPABASE_URL = "https://jgafjlpkdfamvoywggtt.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_QF5kwYRijdV_0xNomd3LWw_893w-ND2";
        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        const statusBox = document.getElementById("folder-status");
        const folderContainer = document.getElementById("definition-folders");

        function safeText(tag, className, value) {
            const element = document.createElement(tag);
            if (className) element.className = className;
            element.textContent = value || "";
            return element;
        }

        async function loadDefinitionFolders() {
            statusBox.textContent = "Loading folders...";
            folderContainer.replaceChildren();

            const { data, error } = await supabaseClient
                .from("definitions_folders")
                .select("id, name, slug, description")
                .eq("published", true)
                .order("name", { ascending: true });

            if (error) {
                statusBox.textContent =
                    "Could not load folders: " + error.message +
                    ". Check the table, its public SELECT policy, and the Supabase API grants.";
                return;
            }

            if (!data || data.length === 0) {
                statusBox.textContent =
                    "No published definition folders yet. Publish a folder from Admin to show it here.";
                return;
            }

            data.forEach(function(folder) {
                const link = document.createElement("a");
                link.className = "definition-folder-card";

                // The existing C++ editor is separate. This public page only links
                // to the generic folder page for definition folders.
                link.href = "definition-folder.html?slug=" +
                    encodeURIComponent(folder.slug);

                link.appendChild(safeText("span", "folder-icon", "📁"));
                link.appendChild(safeText("h2", "", folder.name));
                link.appendChild(safeText("p", "", folder.description));

                folderContainer.appendChild(link);
            });

            statusBox.textContent = "";
        }

        loadDefinitionFolders();
    </script>
</body>
</html>
