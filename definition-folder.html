<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Definitions and learning notes by Prapanj.">
    <title>Definition Folder | Prapanj</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .definition-entry {
            margin: 22px 0;
            padding: 22px;
            border: 1px solid var(--border-color, #ddd);
            border-radius: 12px;
        }
        .definition-entry h2 { margin-top: 0; }
        .definition-entry-content {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.75;
        }
        #folder-status { margin: 20px 0; }
        .definition-entry time { opacity: .7; font-size: .9rem; }
    </style>
</head>
<body>
    <main class="dashboard-page">
        <p class="intro"><a href="index.html">Prapanj</a></p>
        <p><a href="definitions.html">← All Definitions</a></p>

        <h1 id="folder-title">Loading folder...</h1>
        <p id="folder-description"></p>
        <p id="folder-status" role="status">Loading definitions...</p>
        <section id="entries-list" aria-label="Published definitions"></section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        "use strict";

        const SUPABASE_URL = "https://jgafjlpkdfamvoywggtt.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_QF5kwYRijdV_0xNomd3LWw_893w-ND2";
        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        const titleElement = document.getElementById("folder-title");
        const descriptionElement = document.getElementById("folder-description");
        const statusElement = document.getElementById("folder-status");
        const entriesList = document.getElementById("entries-list");

        function makeElement(tag, className, text) {
            const element = document.createElement(tag);
            if (className) element.className = className;
            if (text !== undefined) element.textContent = text;
            return element;
        }

        function formatDate(value) {
            if (!value) return "";
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return "";
            return date.toLocaleDateString("en-IN", {
                day: "numeric",
                month: "long",
                year: "numeric"
            });
        }

        async function loadFolder() {
            const params = new URLSearchParams(window.location.search);
            const slug = (params.get("slug") || "").trim();

            if (!slug) {
                titleElement.textContent = "Folder not specified";
                statusElement.textContent = "Open a folder from the Definitions page.";
                return;
            }

            const { data: folder, error: folderError } = await supabaseClient
                .from("definitions_folders")
                .select("id, name, description")
                .eq("slug", slug)
                .eq("published", true)
                .maybeSingle();

            if (folderError) {
                titleElement.textContent = "Unable to load folder";
                statusElement.textContent = "Database error: " + folderError.message;
                return;
            }

            if (!folder) {
                titleElement.textContent = "Folder not found";
                statusElement.textContent =
                    "This folder does not exist or has not been published.";
                return;
            }

            document.title = folder.name + " | Definitions";
            titleElement.textContent = folder.name;
            descriptionElement.textContent = folder.description || "";

            const { data: entries, error: entriesError } = await supabaseClient
                .from("definition_entries")
                .select("id, title, content, created_at")
                .eq("folder_id", folder.id)
                .eq("published", true)
                .order("created_at", { ascending: false });

            if (entriesError) {
                statusElement.textContent =
                    "Could not load entries: " + entriesError.message +
                    ". Confirm that the definition_entries table and its public read policy exist.";
                return;
            }

            entriesList.replaceChildren();

            if (!entries || entries.length === 0) {
                statusElement.textContent = "No published definitions in this folder yet.";
                return;
            }

            entries.forEach(function(entry) {
                const article = makeElement("article", "definition-entry");
                article.appendChild(makeElement("h2", "", entry.title));

                const dateText = formatDate(entry.created_at);
                if (dateText) {
                    const time = makeElement("time", "", dateText);
                    article.appendChild(time);
                }

                article.appendChild(
                    makeElement("div", "definition-entry-content", entry.content)
                );
                entriesList.appendChild(article);
            });

            statusElement.textContent = "";
        }

        loadFolder();
    </script>
</body>
</html>
