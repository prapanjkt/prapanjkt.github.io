
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Prapanj K T</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<main class="dashboard-page">

    <div class="dashboard-header">
        <div>
            <p class="intro">Prapanj Blog & C++</p>
            <h1>Dashboard</h1>
            <p>Manage your blog and daily C++ practice.</p>
        </div>
        <button id="logout-button" type="button">Logout</button>
    </div>

    <!-- BLOG EDITOR -->
    <section class="editor-box">
        <h2 id="blog-editor-title">Write a new blog</h2>

        <label for="blog-title">Title</label>
        <input id="blog-title" type="text" placeholder="Enter blog title">

        <label for="blog-subtitle">Subtitle</label>
        <input id="blog-subtitle" type="text" placeholder="Enter a short description">

        <label for="blog-content">Content</label>
        <textarea id="blog-content" placeholder="Write your blog here..."></textarea>

        <div class="editor-buttons">
            <button id="blog-draft-button" class="button" type="button">Save Draft</button>
            <button id="blog-publish-button" class="button" type="button">Publish Blog</button>
            <button id="blog-private-button" class="button" type="button">Save Private</button>
            <button id="blog-cancel-button" class="button" type="button" hidden>Cancel Edit</button>
        </div>

        <p id="blog-status" role="status"></p>
    </section>

    <!-- EXISTING BLOG POSTS -->
    <section class="posts-section">
        <h2>Your Blog Posts</h2>
        <div id="posts-list">
            <p>Loading blog posts...</p>
        </div>
    </section>

    <hr>

    <!-- C++ EDITOR -->
    <section class="editor-box">
        <h2 id="cpp-editor-title">Add Daily C++ Code</h2>

        <label for="cpp-title-input">Title</label>
        <input id="cpp-title-input" type="text"
               placeholder="Example: Two Sum using Arrays">

        <label for="cpp-problem-input">Problem statement</label>
        <textarea id="cpp-problem-input"
                  placeholder="Write the problem statement here..."></textarea>

        <label for="cpp-code-input">C++ solution</label>
        <textarea id="cpp-code-input"
                  placeholder="Paste your C++ code here..."
                  spellcheck="false"></textarea>

        <label for="cpp-explanation-input">Explanation</label>
        <textarea id="cpp-explanation-input"
                  placeholder="Explain the approach, algorithm, and complexity..."></textarea>

        <div class="editor-buttons">
            <button id="cpp-draft-button" class="button" type="button">Save Draft</button>
            <button id="cpp-publish-button" class="button" type="button">Publish C++ Post</button>
            <button id="cpp-private-button" class="button" type="button">Save Private</button>
            <button id="cpp-cancel-button" class="button" type="button" hidden>Cancel Edit</button>
        </div>

        <p id="cpp-status" role="status"></p>
    </section>

    <!-- C++ POSTS -->
    <section class="posts-section">
        <h2>Your C++ Posts</h2>
        <div id="cpp-posts-list">
            <p>Loading C++ posts...</p>
        </div>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

const SUPABASE_URL =
    "https://jgafjlpkdfamvoywggtt.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_QF5kwYRijdV_0xNomd3LWw_893w-ND2";

const ADMIN_EMAIL = "ktprapanj@gmail.com";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

const blogStatus = document.getElementById("blog-status");
const cppStatus = document.getElementById("cpp-status");
const postsList = document.getElementById("posts-list");
const cppPostsList = document.getElementById("cpp-posts-list");

let editingBlogId = null;
let editingCppId = null;


// --------------------------------------------------
// LOGIN CHECK
// --------------------------------------------------

async function checkLogin() {
    const { data, error } = await supabaseClient.auth.getSession();

    if (error || !data.session) {
        window.location.href = "admin.html";
        return false;
    }

    if (data.session.user.email !== ADMIN_EMAIL) {
        await supabaseClient.auth.signOut();
        alert("This account is not authorised to access the dashboard.");
        window.location.href = "admin.html";
        return false;
    }

    return true;
}


// --------------------------------------------------
// SHARED HELPERS
// --------------------------------------------------

function formatDate(value) {
    return new Date(value).toLocaleDateString("en-IN", {
        day: "numeric",
        month: "long",
        year: "numeric"
    });
}

function createElement(tag, className, text) {
    const element = document.createElement(tag);

    if (className) element.className = className;
    if (text !== undefined) element.textContent = text;

    return element;
}

function makeButton(text, className, handler) {
    const button = createElement("button", className, text);
    button.type = "button";
    button.addEventListener("click", handler);
    return button;
}


// --------------------------------------------------
// BLOG: LOAD POSTS
// --------------------------------------------------

async function loadPosts() {
    postsList.replaceChildren(createElement("p", "", "Loading blog posts..."));

    const { data, error } = await supabaseClient
        .from("posts")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        postsList.replaceChildren(
            createElement("p", "", "Error loading blog posts: " + error.message)
        );
        return;
    }

    if (!data || data.length === 0) {
        postsList.replaceChildren(
            createElement("p", "", "You haven't created any blog posts yet.")
        );
        return;
    }

    postsList.replaceChildren();

    data.forEach(function(post) {
        const card = createElement("div", "dashboard-post-card");
        const info = createElement("div", "dashboard-post-info");
        const actions = createElement("div", "dashboard-post-actions");

        info.appendChild(createElement("p", "blog-date", formatDate(post.created_at)));
        info.appendChild(createElement("h3", "", post.title));
        info.appendChild(createElement("p", "", post.subtitle || ""));
        info.appendChild(
            createElement("span", "post-status",
                post.published ? "Published" : "Draft / Private")
        );

        actions.appendChild(makeButton("Edit", "edit-post-button", function() {
            editBlogPost(post);
        }));

        actions.appendChild(makeButton("Delete", "delete-post-button", function() {
            deleteBlogPost(post.id);
        }));

        card.append(info, actions);
        postsList.appendChild(card);
    });
}


// --------------------------------------------------
// BLOG: EDIT
// --------------------------------------------------

function editBlogPost(post) {
    editingBlogId = String(post.id);

    document.getElementById("blog-title").value = post.title || "";
    document.getElementById("blog-subtitle").value = post.subtitle || "";
    document.getElementById("blog-content").value = post.content || "";

    document.getElementById("blog-editor-title").textContent = "Edit blog";
    document.getElementById("blog-cancel-button").hidden = false;

    blogStatus.textContent = "Editing blog post.";
    window.scrollTo({ top: 0, behavior: "smooth" });
}


// --------------------------------------------------
// BLOG: SAVE, DRAFT, PUBLISH, PRIVATE
// --------------------------------------------------

async function saveBlog(published, privateSave = false) {
    const title = document.getElementById("blog-title").value.trim();
    const subtitle = document.getElementById("blog-subtitle").value.trim();
    const content = document.getElementById("blog-content").value.trim();

    if (!title || !content) {
        blogStatus.textContent = "Please enter a blog title and content.";
        return;
    }

    blogStatus.textContent = "Saving blog...";

    const post = {
        title: title,
        subtitle: subtitle,
        content: content,
        published: published
    };

    let result;

    if (editingBlogId !== null) {
        result = await supabaseClient
            .from("posts")
            .update(post)
            .eq("id", editingBlogId);
    } else {
        result = await supabaseClient
            .from("posts")
            .insert(post);
    }

    if (result.error) {
        blogStatus.textContent = "Error: " + result.error.message;
        return;
    }

    if (privateSave) {
        blogStatus.textContent = "Saved privately. It is not visible to public visitors.";
    } else if (published) {
        blogStatus.textContent = "Blog published successfully.";
    } else {
        blogStatus.textContent = "Blog draft saved.";
    }

    clearBlogEditor();
    await loadPosts();
}

async function deleteBlogPost(id) {
    if (!confirm("Permanently delete this blog post?")) return;

    const { error } = await supabaseClient
        .from("posts")
        .delete()
        .eq("id", id);

    if (error) {
        blogStatus.textContent = "Error deleting blog: " + error.message;
        return;
    }

    blogStatus.textContent = "Blog post deleted.";
    await loadPosts();
}

function clearBlogEditor() {
    editingBlogId = null;
    document.getElementById("blog-title").value = "";
    document.getElementById("blog-subtitle").value = "";
    document.getElementById("blog-content").value = "";
    document.getElementById("blog-editor-title").textContent = "Write a new blog";
    document.getElementById("blog-cancel-button").hidden = true;
}


// --------------------------------------------------
// C++: LOAD POSTS
// --------------------------------------------------

async function loadCppPosts() {
    cppPostsList.replaceChildren(
        createElement("p", "", "Loading C++ posts...")
    );

    const { data, error } = await supabaseClient
        .from("cpp_posts")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        cppPostsList.replaceChildren(
            createElement("p", "", "Error loading C++ posts: " + error.message)
        );
        return;
    }

    if (!data || data.length === 0) {
        cppPostsList.replaceChildren(
            createElement("p", "", "You haven't created any C++ posts yet.")
        );
        return;
    }

    cppPostsList.replaceChildren();

    data.forEach(function(post) {
        const card = createElement("div", "dashboard-post-card");
        const info = createElement("div", "dashboard-post-info");
        const actions = createElement("div", "dashboard-post-actions");

        info.appendChild(createElement("p", "blog-date", formatDate(post.created_at)));
        info.appendChild(createElement("h3", "", post.title));
        info.appendChild(
            createElement("p", "", post.problem || "No problem statement added.")
        );
        info.appendChild(
            createElement("span", "post-status",
                post.published ? "Published" : "Draft / Private")
        );

        if (post.published) {
            actions.appendChild(makeButton("View", "view-cpp-button", function() {
                window.open(
                    "cpp-post.html?id=" + encodeURIComponent(post.id),
                    "_blank",
                    "noopener"
                );
            }));
        }

        actions.appendChild(makeButton("Edit", "edit-post-button", function() {
            editCppPost(post);
        }));

        actions.appendChild(makeButton("Delete", "delete-post-button", function() {
            deleteCppPost(post.id);
        }));

        card.append(info, actions);
        cppPostsList.appendChild(card);
    });
}


// --------------------------------------------------
// C++: EDIT
// --------------------------------------------------

function editCppPost(post) {
    editingCppId = String(post.id);

    document.getElementById("cpp-title-input").value = post.title || "";
    document.getElementById("cpp-problem-input").value = post.problem || "";
    document.getElementById("cpp-code-input").value = post.code || "";
    document.getElementById("cpp-explanation-input").value = post.explanation || "";

    document.getElementById("cpp-editor-title").textContent = "Edit C++ post";
    document.getElementById("cpp-cancel-button").hidden = false;

    cppStatus.textContent = "Editing C++ post.";
    window.scrollTo({ top: 0, behavior: "smooth" });
}


// --------------------------------------------------
// C++: SAVE, DRAFT, PUBLISH, PRIVATE
// --------------------------------------------------

async function saveCppPost(published, privateSave = false) {
    const title = document.getElementById("cpp-title-input").value.trim();
    const problem = document.getElementById("cpp-problem-input").value.trim();
    const code = document.getElementById("cpp-code-input").value.trim();
    const explanation = document.getElementById("cpp-explanation-input").value.trim();

    if (!title || !code) {
        cppStatus.textContent = "Please enter a title and C++ solution code.";
        return;
    }

    cppStatus.textContent = "Saving C++ post...";

    const post = {
        title: title,
        problem: problem,
        code: code,
        explanation: explanation,
        published: published
    };

    let result;

    if (editingCppId !== null) {
        result = await supabaseClient
            .from("cpp_posts")
            .update(post)
            .eq("id", editingCppId);
    } else {
        result = await supabaseClient
            .from("cpp_posts")
            .insert(post);
    }

    if (result.error) {
        cppStatus.textContent = "Error: " + result.error.message;
        return;
    }

    if (privateSave) {
        cppStatus.textContent = "C++ post saved privately. It is not visible to public visitors.";
    } else if (published) {
        cppStatus.textContent = "C++ post published successfully.";
    } else {
        cppStatus.textContent = "C++ draft saved.";
    }

    clearCppEditor();
    await loadCppPosts();
}

async function deleteCppPost(id) {
    if (!confirm("Permanently delete this C++ post?")) return;

    const { error } = await supabaseClient
        .from("cpp_posts")
        .delete()
        .eq("id", id);

    if (error) {
        cppStatus.textContent = "Error deleting C++ post: " + error.message;
        return;
    }

    cppStatus.textContent = "C++ post deleted.";
    await loadCppPosts();
}

function clearCppEditor() {
    editingCppId = null;
    document.getElementById("cpp-title-input").value = "";
    document.getElementById("cpp-problem-input").value = "";
    document.getElementById("cpp-code-input").value = "";
    document.getElementById("cpp-explanation-input").value = "";
    document.getElementById("cpp-editor-title").textContent = "Add Daily C++ Code";
    document.getElementById("cpp-cancel-button").hidden = true;
}


// --------------------------------------------------
// BUTTON EVENTS
// --------------------------------------------------

document.getElementById("blog-draft-button").addEventListener("click", function() {
    saveBlog(false);
});

document.getElementById("blog-publish-button").addEventListener("click", function() {
    saveBlog(true);
});

document.getElementById("blog-private-button").addEventListener("click", function() {
    saveBlog(false, true);
});

document.getElementById("blog-cancel-button").addEventListener("click", function() {
    clearBlogEditor();
    blogStatus.textContent = "";
});

document.getElementById("cpp-draft-button").addEventListener("click", function() {
    saveCppPost(false);
});

document.getElementById("cpp-publish-button").addEventListener("click", function() {
    saveCppPost(true);
});

document.getElementById("cpp-private-button").addEventListener("click", function() {
    saveCppPost(false, true);
});

document.getElementById("cpp-cancel-button").addEventListener("click", function() {
    clearCppEditor();
    cppStatus.textContent = "";
});

document.getElementById("logout-button").addEventListener("click", async function() {
    await supabaseClient.auth.signOut();
    window.location.href = "admin.html";
});


// --------------------------------------------------
// START DASHBOARD
// --------------------------------------------------

async function startDashboard() {
    const loggedIn = await checkLogin();
    if (!loggedIn) return;

    await Promise.all([
        loadPosts(),
        loadCppPosts()
    ]);
}

startDashboard();
</script>
</body>
</html>
