<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Prapanj K T</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="dashboard-page">

        <div class="dashboard-header">

            <div>

                <p class="intro">
                    Prapanj Blog
                </p>

                <h1>
                    Dashboard
                </h1>

            </div>


            <button id="logout-button">
                Logout
            </button>

        </div>



        <!-- Write / Edit -->

        <section class="editor-box">

            <h2 id="editor-title">
                Write a new blog
            </h2>


            <label for="title">
                Title
            </label>

            <input
                type="text"
                id="title"
                placeholder="Enter blog title"
            >


            <label for="subtitle">
                Subtitle
            </label>

            <input
                type="text"
                id="subtitle"
                placeholder="Enter a short description"
            >


            <label for="content">
                Content
            </label>

            <textarea
                id="content"
                placeholder="Write your blog here..."
            ></textarea>


            <div class="editor-buttons">

                <button
                    id="draft-button"
                    class="button"
                >
                    Save Draft
                </button>


                <button
                    id="publish-button"
                    class="button"
                >
                    Publish
                </button>

                <button
    id="private-button"
    class="button"
>
    Private
</button>


                <button
                    id="cancel-button"
                    class="button"
                    style="display:none;"
                >
                    Cancel Edit
                </button>

            </div>


            <p id="status"></p>

        </section>



        <!-- Previous Posts -->

        <section class="posts-section">

            <h2>
                Your Posts
            </h2>


            <div id="posts-list">

                <p>
                    Loading posts...
                </p>

            </div>

        </section>


    </main>



    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const SUPABASE_URL =
            "https://jgafjlpkdfamvoywggtt.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_QF5kwYRijdV_0xNomd3LWw_893w-ND2";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );



        const status =
            document.getElementById("status");


        const postsList =
            document.getElementById("posts-list");


        let editingPostId = null;



        // --------------------------------------------------
        // CHECK LOGIN
        // --------------------------------------------------

        async function checkLogin() {

            const { data } =
                await supabaseClient.auth.getSession();


            if (!data.session) {

                window.location.href =
                    "admin.html";

                return false;

            }


            return true;

        }



        // --------------------------------------------------
        // LOAD POSTS
        // --------------------------------------------------

        async function loadPosts() {

            postsList.innerHTML =
                "<p>Loading posts...</p>";


            const { data, error } =
                await supabaseClient
                    .from("posts")
                    .select("*")
                    .order("created_at", {
                        ascending: false
                    });


            if (error) {

                postsList.innerHTML =
                    "<p>Error loading posts: "
                    + error.message
                    + "</p>";

                return;

            }


            if (!data || data.length === 0) {

                postsList.innerHTML =
                    "<p>You haven't created any posts yet.</p>";

                return;

            }


            postsList.innerHTML = "";


            data.forEach(function(post) {

                const card =
                    document.createElement("div");

                card.className =
                    "dashboard-post-card";


                const statusText =
                    post.published
                        ? "Published"
                        : "Draft";


                const date =
                    new Date(post.created_at)
                        .toLocaleDateString(
                            "en-IN",
                            {
                                day: "numeric",
                                month: "long",
                                year: "numeric"
                            }
                        );


                card.innerHTML = `

                    <div class="dashboard-post-info">

                        <p class="blog-date">
                            ${date}
                        </p>

                        <h3>
                            ${escapeHTML(post.title)}
                        </h3>

                        <p>
                            ${escapeHTML(
                                post.subtitle || ""
                            )}
                        </p>

                        <span class="post-status">
                            ${statusText}
                        </span>

                    </div>


                    <div class="dashboard-post-actions">

                        <button
                            class="edit-post-button"
                            data-id="${post.id}"
                        >
                            Edit
                        </button>

                        <button
                            class="delete-post-button"
                            data-id="${post.id}"
                        >
                            Delete
                        </button>

                    </div>

                `;


                postsList.appendChild(card);

            });


            // Edit buttons

            document
                .querySelectorAll(".edit-post-button")
                .forEach(function(button) {

                    button.addEventListener(
                        "click",
                        function() {

                            editPost(
                                Number(button.dataset.id),
                                data
                            );

                        }
                    );

                });


            // Delete buttons

            document
                .querySelectorAll(".delete-post-button")
                .forEach(function(button) {

                    button.addEventListener(
                        "click",
                        function() {

                            deletePost(
                                Number(button.dataset.id)
                            );

                        }
                    );

                });

        }



        // --------------------------------------------------
        // EDIT POST
        // --------------------------------------------------

        function editPost(id, posts) {

            const post =
                posts.find(function(item) {

                    return item.id === id;

                });


            if (!post) {
                return;
            }


            editingPostId = id;


            document.getElementById("title").value =
                post.title;


            document.getElementById("subtitle").value =
                post.subtitle || "";


            document.getElementById("content").value =
                post.content;


            document.getElementById("editor-title")
                .textContent =
                "Edit blog";


            document.getElementById("cancel-button")
                .style.display =
                "inline-block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }



        // --------------------------------------------------
        // SAVE POST
        // --------------------------------------------------

        async function savePost(published) {

            const title =
                document.getElementById("title")
                    .value
                    .trim();


            const subtitle =
                document.getElementById("subtitle")
                    .value
                    .trim();


            const content =
                document.getElementById("content")
                    .value
                    .trim();


            if (!title || !content) {

                status.textContent =
                    "Please enter a title and content.";

                return;

            }


            status.textContent =
                "Saving...";


            let error;


            if (editingPostId !== null) {

                const result =
                    await supabaseClient
                        .from("posts")
                        .update({

                            title: title,

                            subtitle: subtitle,

                            content: content,

                            published: published

                        })
                        .eq("id", editingPostId);


                error = result.error;

            } else {

                const result =
                    await supabaseClient
                        .from("posts")
                        .insert({

                            title: title,

                            subtitle: subtitle,

                            content: content,

                            published: published

                        });


                error = result.error;

            }


            if (error) {

                status.textContent =
                    "Error: " + error.message;

                return;

            }


            status.textContent =
                published
                    ? "Blog published successfully!"
                    : "Draft saved successfully!";


            clearEditor();

            loadPosts();

        }



        // --------------------------------------------------
        // DELETE POST
        // --------------------------------------------------

        async function deletePost(id) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this post?"
                );


            if (!confirmed) {
                return;
            }


            const { error } =
                await supabaseClient
                    .from("posts")
                    .delete()
                    .eq("id", id);


            if (error) {

                status.textContent =
                    "Error deleting post: "
                    + error.message;

                return;

            }


            status.textContent =
                "Post deleted.";


            loadPosts();

        }



        // --------------------------------------------------
        // CLEAR EDITOR
        // --------------------------------------------------

        function clearEditor() {

            editingPostId = null;


            document.getElementById("title").value =
                "";


            document.getElementById("subtitle").value =
                "";


            document.getElementById("content").value =
                "";


            document.getElementById("editor-title")
                .textContent =
                "Write a new blog";


            document.getElementById("cancel-button")
                .style.display =
                "none";

        }



        // --------------------------------------------------
        // ESCAPE HTML
        // --------------------------------------------------

        function escapeHTML(text) {

            const div =
                document.createElement("div");


            div.textContent =
                text;


            return div.innerHTML;

        }



        // --------------------------------------------------
        // LOGOUT
        // --------------------------------------------------

        document
            .getElementById("logout-button")
            .addEventListener(
                "click",
                async function() {

                    await supabaseClient.auth.signOut();

                    window.location.href =
                        "admin.html";

                }
            );



        // --------------------------------------------------
        // BUTTONS
        // --------------------------------------------------

        document
            .getElementById("draft-button")
            .addEventListener(
                "click",
                function() {

                    savePost(false);

                }
            );


        document
            .getElementById("publish-button")
            .addEventListener(
                "click",
                function() {

                    savePost(true);

                }
            );


        document
            .getElementById("cancel-button")
            .addEventListener(
                "click",
                function() {

                    clearEditor();

                    status.textContent =
                        "";

                }
            );



        // --------------------------------------------------
        // START
        // --------------------------------------------------

        async function startDashboard() {

            const loggedIn =
                await checkLogin();


            if (!loggedIn) {
                return;
            }


            loadPosts();

        }


        startDashboard();

    </script>


</body>

</html>
